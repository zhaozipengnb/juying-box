<!DOCTYPE html>
<!--
  drpy 壳页面 v2：Worker 宿主
  架构：ArkTS 注入 drpy2/ext 代码文本 → 本页转发给 Worker → Worker 内同步 XHR 网络栈原生执行 drpy2
  （drpy2 的宿主 req 为同步语义，仅 Worker 线程合法；主线程禁同步 XHR，故运行时必须置于 Worker）
  协议：
    ArkTS → 本页 → Worker：__workerInit(cfgJson)（drpy2/ext 代码先经 window.__drpy2Code/__extCode 注入）
                        __workerCall(id, method, argsJson)
    Worker → 本页 → ArkTS：onmessage {type:'result', id, value} 写入 __callResults[id]；ArkTS 轮询 __drpyResult(id)
-->
<html>
<head><meta charset="utf-8"><title>drpy-shell</title></head>
<body>
<script>
  var worker = new Worker('drpy_worker.js');
  var __callResults = {};
  var __initDone = false;

  worker.onmessage = function (ev) {
    var m = ev.data;
    if (m.type === 'log') { console.info('OKV-WORKER: ' + m.msg); return; }
    if (m.type === 'result') {
      __callResults[m.id] = m.value;
      if (m.id === '__init__' && m.value.indexOf('__error') < 0) { __initDone = true; }
    }
  };
  worker.onerror = function (e) { console.error('OKV-WORKER-ERR: ' + (e.message || 'unknown')); };

  // ArkTS 调用：注入代码文本后转发 init
  window.__workerInit = function (cfgJson) {
    __initDone = false;
    delete __callResults['__init__'];
    worker.postMessage({ type: 'init', drpy2Code: window.__drpy2Code || '', extCode: window.__extCode || '', cfgJson: cfgJson, callId: '__init__' });
  };
  // ArkTS 调用：同步发起 call（返回 id），结果经 Worker 异步回写
  window.__workerCall = function (method, argsJson) {
    var id = 'c' + Math.random().toString(36).slice(2);
    var args = JSON.parse(argsJson);
    worker.postMessage({ type: 'call', method: method, args: args, id: id });
    return id;
  };
  // ArkTS 轮询：'' = 未完成；强制字符串化（Worker postMessage 的 value 若为对象会让 getString 抛类型错）
  window.__drpyResult = function (id) {
    var v = __callResults[id];
    if (v === undefined) { return ''; }
    if (typeof v === 'string') { return v; }
    console.info('OKV-WARN: call result was ' + typeof v + ', stringified');
    return JSON.stringify(v);
  };
  window.__drpyInitDone = function () { return __initDone ? '1' : ''; };

  console.info('OKV shell v2 ready');
</script>
</body>
</html>
